<svg xmlns="http://www.w3.org/2000/svg" width="800" height="162" viewBox="0 0 800 162"><title>Check the patient split</title><style>@media (prefers-reduced-motion: no-preference){g[transform] rect{animation: highlight 3s ease-in-out 1}g[transform]:nth-child(2) rect{animation-delay:.8s}g[transform]:nth-child(3) rect{animation-delay:1.6s}}@keyframes highlight{0%,100%{fill:#f6f8fc}35%{fill:#c8efe5}}</style><g font-family="system-ui, sans-serif"><g transform="translate(14 12)"><rect width="252" height="138" rx="9" fill="#f6f8fc" stroke="#a3afbf"/><text x="16" y="28" font-size="16" fill="#355374">The result</text><text x="16" y="77" font-family="monospace" font-size="32" fill="#08796d">:)</text><text x="16" y="111" font-size="18" fill="#102748">Model looks great.</text></g><g transform="translate(274 12)"><rect width="252" height="138" rx="9" fill="#f6f8fc" stroke="#a3afbf"/><text x="16" y="28" font-size="16" fill="#355374">The first question</text><text x="16" y="77" font-family="monospace" font-size="32" fill="#08796d">:|</text><text x="16" y="111" font-size="18" fill="#102748">Check the patient split.</text></g><g transform="translate(534 12)"><rect width="252" height="138" rx="9" fill="#f6f8fc" stroke="#a3afbf"/><text x="16" y="28" font-size="16" fill="#355374">The second question</text><text x="16" y="77" font-family="monospace" font-size="32" fill="#08796d">:|</text><text x="16" y="111" font-size="18" fill="#102748">Check it again.</text></g></g></svg>